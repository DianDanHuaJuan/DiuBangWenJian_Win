name: diubangwenjian
description: "铥棒文件 - 局域网 P2P 对等文件互传与 NAS"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.0
  provider: ^6.1.5+1

  # Routing
  go_router: ^15.1.2

  # Network: server side
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3

  # Network: client side
  dio: ^5.8.0
  dio_http2_adapter: ^2.7.0
  connectivity_plus: ^6.1.4
  network_info_plus: ^6.0.0

  # Crypto / TLS identity
  cryptography: ^2.0.0
  crypto: ^3.0.3
  basic_utils: ^5.8.2
  pointycastle: ^4.0.0

  # Local storage (single SQLite, doc/01 §五)
  sqflite: ^2.4.2
  sqflite_common_ffi: 2.3.7
  sqlite3: 2.9.4
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  path: ^1.9.1
  path_provider: ^2.1.5

  # Files
  file_picker: ^9.2.1
  file_selector: ^1.1.0

  # QR pairing
  qr_flutter: ^4.0.0

  # Images & video (preview / media kit)
  extended_image: ^10.0.1
  image: ^4.8.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_windows_video: ^1.0.11
  flutter_svg: ^2.1.0

  # Device info
  device_info_plus: ^12.0.0
  stream_channel: ^2.1.4

  # Windows desktop shell
  window_manager: ^0.5.1
  system_tray: ^2.0.3
  launch_at_startup: ^0.5.1
  win32: ^5.15.0
  ffi: ^2.2.0

dependency_overrides:
  sqlite3: 2.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ffmpeg.exe
    - assets/app_icon.ico
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansCJKsc-Regular.otf
          weight: 400
        - asset: assets/fonts/NotoSansCJKsc-Bold.otf
          weight: 700
